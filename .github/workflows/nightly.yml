# Final Form autopilot: every night, re-checks the answers the live game was unsure about and keeps the next
# few days stocked with new AI-written prompts. Free: GitHub Actions + Google AI Studio (Gemma) + Supabase free plan.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   Secrets:   GEMINI_API_KEY          Google AI Studio key (the same kind the game server uses)
#              FF_ADMIN_TOKEN          the ADMIN_TOKEN set on the Supabase function
#              SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens (lets the job redeploy the function)
#   Variables (optional): AUTO_APPROVE=off  /  AUTO_PROMPTS=off  turn either half off without editing code
name: nightly
on:
  schedule:
    - cron: '23 7 * * *'   # 2:23 AM New York (07:23 UTC)
  workflow_dispatch: {}      # "Run workflow" button for a manual run
permissions:
  contents: write
concurrency: nightly
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FF_API: https://shcgxmossnssipxpfpwx.supabase.co/functions/v1/ff
      SUPABASE_REF: shcgxmossnssipxpfpwx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Review answers and write prompts
        env:
          EXPAND_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.FF_ADMIN_TOKEN }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          AUTO_PROMPTS: ${{ vars.AUTO_PROMPTS }}
        run: node tools/nightly.mjs
      - name: Anything new?
        id: diff
        run: |
          node tools/build-server-data.mjs
          if git diff --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      # the server must know the new prompts before the site does
      - uses: supabase/setup-cli@v1
        if: steps.diff.outputs.changed == 'yes'
      - name: Redeploy the game server
        if: steps.diff.outputs.changed == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ff --project-ref "$SUPABASE_REF" --no-verify-jwt
      - name: Publish
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name "final-form-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add prompts-auto.js supabase/functions/_shared
          git commit -m "Autopilot: new daily prompts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
